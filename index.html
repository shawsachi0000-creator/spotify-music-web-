<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Music</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
    }

    header {
      padding: 25px 20px;
      background: #000;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #222;
    }

    header h1 {
      text-align: center;
      color: #1db954;
      margin-bottom: 20px;
    }

    .search-box {
      max-width: 650px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      padding: 14px 20px;
      border-radius: 30px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    .search-box button {
      padding: 14px 24px;
      border: none;
      border-radius: 30px;
      background: #1db954;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      width: min(1100px, 94%);
      margin: auto;
      padding: 40px 0;
    }

    .hero {
      text-align: center;
      padding: 45px 20px;
    }

    .hero h2 {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #aaa;
      font-size: 17px;
    }

    .section {
      margin-top: 40px;
    }

    .section h2 {
      margin-bottom: 20px;
      font-size: 26px;
    }

    .playlist-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(300px, 1fr));
      gap: 22px;
    }

    .playlist-card {
      background: #181818;
      padding: 10px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #252525;
    }

    .playlist-card:hover {
      border-color: #1db954;
    }

    .playlist-card iframe {
      display: block;
      width: 100%;
      height: 352px;
      border: none;
      border-radius: 12px;
    }

    .search-results {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .result-card {
      background: #181818;
      padding: 20px;
      border-radius: 14px;
    }

    .result-card h3 {
      margin-bottom: 10px;
    }

    .result-card p {
      color: #aaa;
      margin-bottom: 15px;
    }

    .result-card button {
      background: #1db954;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 22px;
      cursor: pointer;
      font-weight: bold;
    }

    .spotify-login {
      margin-top: 45px;
      padding: 30px;
      text-align: center;
      background: #181818;
      border-radius: 16px;
    }

    .spotify-login h2 {
      margin-bottom: 10px;
    }

    .spotify-login p {
      color: #aaa;
      margin-bottom: 18px;
    }

    #spotifyLoginBtn {
      background: #1db954;
      color: white;
      border: none;
      padding: 13px 25px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: #777;
      border-top: 1px solid #222;
      margin-top: 50px;
    }

    @media (max-width: 600px) {

      .search-box {
        flex-direction: column;
      }

      .search-box button {
        width: 100%;
      }

      .hero h2 {
        font-size: 28px;
      }

      .playlist-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
<div class="spotify-logo">●</div>
    <div class="brand">
  <div class="spotify-logo">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <h1>My Music</h1>
    </div>

    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        placeholder="Search songs, artists or playlists..."
      >

      <button onclick="searchMusic()">
        Search
      </button>

    </div>

  </header>


  <main>

    <section class="hero">

      <h2>🎧 Your Music World</h2>

      <p>
        Discover and listen to music through Spotify.
      </p>

    </section>


    <!-- =========================
         SPOTIFY PLAYLISTS
         ========================= -->

    <section class="section">

      <h2>🔥 Featured Playlists</h2>

      <div class="playlist-grid">


        <!-- Playlist 1 -->

        <div class="playlist-card">

          <iframe
            src="https://open.spotify.com/embed/playlist/37i9dQZF1E8LkVkx8VccyZ"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
          </iframe>

        </div>


        <!-- Playlist 2 -->

        <div class="playlist-card">

          <iframe
            src="https://open.spotify.com/embed/playlist/37i9dQZF1E4yDV1qhdLHxf"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
          </iframe>

        </div>


        <!-- Playlist 3 -->

        <div class="playlist-card">

          <iframe
            src="https://open.spotify.com/embed/playlist/37i9dQZF1DXbVhgADFy3im"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
          </iframe>

        </div>


        <!-- Playlist 4 -->

        <div class="playlist-card">

          <iframe
            src="https://open.spotify.com/embed/playlist/37i9dQZF1DXdpQPPZq3F7n"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
          </iframe>

        </div>


      </div>

    </section>


    <!-- =========================
         SEARCH RESULTS
         ========================= -->

    <section class="section">

      <h2>🔎 Search Music</h2>

      <div
        id="searchResults"
        class="search-results">

        <div class="result-card">

          <h3>🎵 Music Search</h3>

          <p>
            Connect Spotify to search music.
          </p>

        </div>

      </div>

    </section>


    <!-- =========================
         SPOTIFY LOGIN
         ========================= -->

    <section class="spotify-login">

      <h2>🎧 Connect Spotify</h2>

      <p>
        Connect your Spotify account to use music search.
      </p>

      <button
        id="spotifyLoginBtn"
        onclick="loginWithSpotify()">

        🎵 Connect Spotify

      </button>

      <p id="loginStatus"></p>

    </section>


  </main>


  <footer>

    © 2026 My Music

  </footer>


  <script src="script.js"></script>

</body>
</html>
